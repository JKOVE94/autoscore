name: docker-publish

# Builds the backend + frontend images for linux/amd64 and linux/arm64 and
# pushes multi-arch manifests to GitHub Container Registry (ghcr.io), and — when
# configured — also to Docker Hub (so they show up in Docker Desktop search).
#
#   push to main        -> :latest, :main, :sha-<short>
#   tag v1.2.3          -> :1.2.3, :1.2, :latest
#   manual (dispatch)   -> same as the branch it runs on
#
# Docker Hub (optional): add repo Variable DOCKERHUB_USERNAME and repo Secret
# DOCKERHUB_TOKEN (Settings > Secrets and variables > Actions). Without them the
# workflow just publishes to GHCR.
#
# Pull:  docker pull ghcr.io/jkove94/autoscore-backend:latest
#        docker pull <dockerhub-user>/autoscore-backend:latest   # if Hub is configured

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        image: [backend, frontend]
        platform:
          - runner: ubuntu-latest
            arch: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: linux/arm64
    runs-on: ${{ matrix.platform.runner }}
    steps:
      - name: Prepare
        run: |
          echo "REGISTRY_IMAGE=ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}" >> "$GITHUB_ENV"
          arch='${{ matrix.platform.arch }}'
          echo "PLATFORM_PAIR=${arch//\//-}" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY_IMAGE }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.image }}/Dockerfile
          platforms: ${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,name=${{ env.REGISTRY_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}-${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ matrix.image }}-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [backend, frontend]
    env:
      # optional: set repo variable DOCKERHUB_USERNAME + secret DOCKERHUB_TOKEN
      # to also publish to Docker Hub (so the images are searchable in Docker Desktop)
      DOCKERHUB_USERNAME: ${{ vars.DOCKERHUB_USERNAME }}
    steps:
      - name: Prepare
        run: |
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}-${{ matrix.image }}"
          echo "GHCR_IMAGE=$ghcr" >> "$GITHUB_ENV"
          {
            echo 'IMAGES<<EOF'
            echo "$ghcr"
            [ -n "$DOCKERHUB_USERNAME" ] && echo "docker.io/${DOCKERHUB_USERNAME}/autoscore-${{ matrix.image }}"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-${{ matrix.image }}-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest list(s)
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${GHCR_IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${GHCR_IMAGE}:${{ steps.meta.outputs.version }}"
