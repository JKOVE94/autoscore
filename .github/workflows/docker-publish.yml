name: docker-publish

# Builds the single combined image (backend + web UI) for linux/amd64 and
# linux/arm64 and pushes a multi-arch manifest to GitHub Container Registry
# (ghcr.io), and — when configured — also to Docker Hub (so it shows up in
# Docker Desktop search).
#
#   push to main        -> :latest, :main, :sha-<short>
#   tag v1.2.3          -> :1.2.3, :1.2, :latest
#   manual (dispatch)   -> same as the branch it runs on
#
# Docker Hub (optional): add repo Secrets DOCKERHUB_USERNAME and DOCKERHUB_TOKEN
# (Settings > Secrets and variables > Actions > Secrets). Without them it just
# publishes to GHCR.
#
# Pull:  docker pull ghcr.io/jkove94/autoscore:latest
#        docker pull <dockerhub-user>/autoscore:latest        # if Hub is configured

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
    paths-ignore:
      - "**.md"
      - "docs/**"
      - "LICENSE"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        platform:
          - runner: ubuntu-latest
            arch: linux/amd64
          - runner: ubuntu-24.04-arm
            arch: linux/arm64
    runs-on: ${{ matrix.platform.runner }}
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Prepare
        run: |
          arch='${{ matrix.platform.arch }}'
          echo "PLATFORM_PAIR=${arch//\//-}" >> "$GITHUB_ENV"
          names="ghcr.io/${GITHUB_REPOSITORY,,}"
          [ -n "$DOCKERHUB_USERNAME" ] && names="${names},docker.io/${DOCKERHUB_USERNAME}/autoscore"
          echo "PUSH_NAMES=$names" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}

      - uses: docker/setup-buildx-action@v3

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          platforms: ${{ matrix.platform.arch }}
          labels: ${{ steps.meta.outputs.labels }}
          provenance: false
          outputs: type=image,"name=${{ env.PUSH_NAMES }}",push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ env.PLATFORM_PAIR }}
          cache-to: type=gha,mode=max,scope=${{ env.PLATFORM_PAIR }}

      - name: Export digest
        run: |
          mkdir -p "${{ runner.temp }}/digests"
          digest='${{ steps.build.outputs.digest }}'
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ env.PLATFORM_PAIR }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    env:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
    steps:
      - name: Prepare
        run: |
          ghcr="ghcr.io/${GITHUB_REPOSITORY,,}"
          echo "GHCR_IMAGE=$ghcr" >> "$GITHUB_ENV"
          {
            echo 'IMAGES<<EOF'
            echo "$ghcr"
            [ -n "$DOCKERHUB_USERNAME" ] && echo "docker.io/${DOCKERHUB_USERNAME}/autoscore"
            echo 'EOF'
          } >> "$GITHUB_ENV"

      - uses: actions/download-artifact@v4
        with:
          path: ${{ runner.temp }}/digests
          pattern: digests-*
          merge-multiple: true

      - uses: docker/setup-buildx-action@v3

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGES }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Log in to Docker Hub
        if: env.DOCKERHUB_USERNAME != ''
        uses: docker/login-action@v3
        with:
          username: ${{ env.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Create and push manifest list(s)
        working-directory: ${{ runner.temp }}/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${GHCR_IMAGE}@sha256:%s " *)

      - name: Inspect
        run: docker buildx imagetools inspect "${GHCR_IMAGE}:${{ steps.meta.outputs.version }}"
