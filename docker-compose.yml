name: autoscore

# One service: backend + UI in a single container on http://localhost:8000
# `docker compose up` builds locally; `docker compose pull` fetches from GHCR.
services:
  app:
    image: ghcr.io/jkove94/autoscore:latest
    build:
      context: .
      args:
        WITH_DEMUCS: ${WITH_DEMUCS:-0}
    ports:
      - "8000:8000"
    environment:
      APP_ENV: development
      TORCH_DEVICE: cpu
      STORAGE_DIR: /data
      # demucs is only installed when built with WITH_DEMUCS=1; otherwise mode
      # 1/2 return a clear "install a separator" error.
      STEM_FALLBACK: demucs
    volumes:
      - autoscore-data:/data

volumes:
  autoscore-data:
