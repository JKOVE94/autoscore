apiVersion: v1
kind: ConfigMap
metadata:
  name: autoscore-config
  labels:
    app.kubernetes.io/name: autoscore
data:
  APP_ENV: "production"
  LOG_LEVEL: "INFO"
  # No Apple-Silicon acceleration in-cluster.
  TORCH_DEVICE: "cpu"
  STORAGE_DIR: "/data"
  MAX_UPLOAD_MB: "100"
  # demucs is only present if you build the image with --build-arg WITH_DEMUCS=1;
  # otherwise input modes 1/2 return a clear "install a separator" error.
  STEM_FALLBACK: "demucs"
  YOUTUBE_ENABLED: "true"
  YOUTUBE_MAX_DURATION_SEC: "900"
